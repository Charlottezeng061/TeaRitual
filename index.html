<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="https://use.typekit.net/kda0bpx.css">
  <title>Tea Ritual</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="top-bar">
    <div class="title">
      <h1>Tea Ritual</h1>
    </div>

    <section class="guide" aria-label="Tea-making guide">
      <div class="guide-box" aria-live="polite">
        <span id="step-number">01 / 06</span>
        <h2 id="step-title">Pick tea leaves</h2>
        <p id="step-instruction">
          Drag the tea tongs to the canister to pick up leaves.
        </p>
      </div>

      <ol class="progress" aria-label="Progress">
        <li class="current" aria-label="Pick tea leaves"></li>
        <li aria-label="Fill scoop"></li>
        <li aria-label="Add tea"></li>
        <li aria-label="Pour water"></li>
        <li aria-label="Pour tea"></li>
        <li aria-label="Serve"></li>
      </ol>
    </section>
  </header>

  <main class="scene" aria-label="Tea table">
    <div class="table" aria-hidden="true"></div>

    <img class="tray"
      src="assets/tea-tray.png"
      alt="Wooden tea tray"
      draggable="false">

    <img class="object canister"
      src="assets/tea-canister.png"
      alt="Tea canister"
      draggable="false">

    <img class="object scoop"
      src="assets/tea-scoop.png"
      alt="Tea scoop"
      draggable="false">

    <img class="object tongs"
      src="assets/tea-tongs.png"
      alt="Tea tongs"
      draggable="false">

    <img class="object gaiwan"
      src="assets/gaiwan-open.png"
      alt="Open gaiwan"
      draggable="false">

    <img class="object pitcher"
      src="assets/fairness-pitcher-empty.png"
      alt="Empty fairness pitcher"
      draggable="false">

    <img class="object kettle"
      src="assets/kettle.png"
      alt="Kettle"
      draggable="false">

    <img class="object cup cup-one"
      src="assets/tea-cup-empty.png"
      alt="Empty tea cup one"
      draggable="false">

    <img class="object cup cup-two"
      src="assets/tea-cup-empty.png"
      alt="Empty tea cup two"
      draggable="false">

    <img class="object cup cup-three"
      src="assets/tea-cup-decorated.png"
      alt="Bamboo-patterned tea cup"
      draggable="false">

    <img class="object pet"
      src="assets/tea-pet.png"
      alt="Tea pet"
      draggable="false">
  </main>
</body>
</html>
